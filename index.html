<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memorama de Frutas y Verduras</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#7ed957,#f9f871);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:100%;
max-width:500px;
background:white;
border-radius:25px;
padding:20px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
text-align:center;
}

h1{
color:#2e7d32;
margin-bottom:10px;
}

p{
margin-bottom:15px;
color:#555;
font-weight:bold;
}

.stats{
display:flex;
justify-content:space-between;
margin-bottom:15px;
font-weight:bold;
color:#2e7d32;
}

.game{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

.card{
aspect-ratio:1;
background:#43a047;
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
font-size:35px;
cursor:pointer;
transition:.4s;
transform-style:preserve-3d;
position:relative;
}

.card.flip{
background:#fff8e1;
transform:rotateY(180deg);
}

.card.matched{
background:#81c784;
cursor:default;
}

.card span{
transform:rotateY(180deg);
}

button{
margin-top:20px;
padding:12px 20px;
border:none;
background:#ff9800;
color:white;
font-size:16px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
transition:.3s;
}

button:hover{
background:#f57c00;
}

.win{
margin-top:15px;
font-size:20px;
font-weight:bold;
color:#2e7d32;
}

@media(max-width:500px){
.card{
font-size:28px;
}
}
</style>
</head>

<body>

<div class="container">

<h1>🍎 Memorama</h1>

<p>Frutas y Verduras</p>

<div class="stats">
<span>Movimientos: <span id="moves">0</span></span>
<span>Pares: <span id="pairs">0</span>/8</span>
</div>

<div class="game" id="game"></div>

<button onclick="restartGame()">🔄 Reiniciar</button>

<div class="win" id="win"></div>

</div>

<script>

const emojis = [
"🍎","🍎",
"🍌","🍌",
"🍇","🍇",
"🍓","🍓",
"🥕","🥕",
"🌽","🌽",
"🥒","🥒",
"🍅","🍅"
];

let firstCard=null;
let secondCard=null;
let lockBoard=false;
let moves=0;
let pairs=0;

const game=document.getElementById("game");

function shuffle(array){
for(let i=array.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[array[i],array[j]]=[array[j],array[i]];
}
return array;
}

function createBoard(){

game.innerHTML="";

shuffle(emojis).forEach(emoji=>{

const card=document.createElement("div");

card.classList.add("card");

card.dataset.emoji=emoji;

card.innerHTML="<span>"+emoji+"</span>";

card.addEventListener("click",flipCard);

game.appendChild(card);

});

}

function flipCard(){

if(lockBoard) return;

if(this===firstCard) return;

if(this.classList.contains("matched")) return;

this.classList.add("flip");

if(!firstCard){
firstCard=this;
return;
}

secondCard=this;

moves++;
document.getElementById("moves").textContent=moves;

checkMatch();

}

function checkMatch(){

let match=
firstCard.dataset.emoji===
secondCard.dataset.emoji;

match ? disableCards() : unflipCards();

}

function disableCards(){

firstCard.classList.add("matched");
secondCard.classList.add("matched");

pairs++;

document.getElementById("pairs").textContent=pairs;

resetBoard();

if(pairs===8){

document.getElementById("win").innerHTML=
"🎉 ¡Felicidades! Has ganado 🎉";

}

}

function unflipCards(){

lockBoard=true;

setTimeout(()=>{

firstCard.classList.remove("flip");
secondCard.classList.remove("flip");

resetBoard();

},900);

}

function resetBoard(){

[firstCard,secondCard,lockBoard]=[null,null,false];

}

function restartGame(){

moves=0;
pairs=0;

document.getElementById("moves").textContent=0;
document.getElementById("pairs").textContent=0;

document.getElementById("win").innerHTML="";

resetBoard();

createBoard();

}

createBoard();

</script>

</body>
</html>
