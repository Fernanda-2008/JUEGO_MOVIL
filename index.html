<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memorama de Alimentos</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#8BC34A,#FFEB3B);
padding:15px;
}

.container{
width:100%;
max-width:600px;
background:white;
border-radius:25px;
padding:20px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h1{
text-align:center;
color:#2E7D32;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:15px;
}

.stats{
display:flex;
justify-content:space-between;
background:#f5f5f5;
padding:12px;
border-radius:15px;
margin-bottom:15px;
font-weight:bold;
color:#2E7D32;
}

.message{
text-align:center;
font-weight:bold;
margin-bottom:15px;
color:#E65100;
}

.game{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

.card{
height:90px;
position:relative;
cursor:pointer;
perspective:1000px;
}

.card-inner{
width:100%;
height:100%;
position:relative;
transition:transform .5s;
transform-style:preserve-3d;
}

.card.flip .card-inner{
transform:rotateY(180deg);
}

.front,
.back{
position:absolute;
width:100%;
height:100%;
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
backface-visibility:hidden;
}

.front{
background:linear-gradient(135deg,#43A047,#2E7D32);
color:white;
font-size:30px;
}

.back{
background:#FFFDE7;
transform:rotateY(180deg);
font-size:40px;
border:3px solid #FFD54F;
}

.matched .back{
background:#C8E6C9;
}

button{
width:100%;
margin-top:15px;
padding:14px;
border:none;
border-radius:15px;
background:#FF9800;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#F57C00;
}

.win{
margin-top:15px;
text-align:center;
font-size:22px;
font-weight:bold;
color:#2E7D32;
}

@media(max-width:480px){
.card{
height:75px;
}

.back{
font-size:32px;
}
}
</style>
</head>

<body>

<div class="container">

<h1>🍎 Memorama de Alimentos 🍰</h1>

<div class="subtitle">
Memoriza las cartas antes de que se oculten
</div>

<div class="stats">
<div>👆 Movimientos: <span id="moves">0</span></div>
<div>⏱️ <span id="timer">0</span>s</div>
</div>

<div class="message" id="message">
Memoriza las cartas...
</div>

<div class="game" id="game"></div>

<button onclick="restartGame()">
🔄 Nueva Partida
</button>

<div class="win" id="win"></div>

</div>

<script>

const emojis = [
"🍎","🍎",
"🍌","🍌",
"🍇","🍇",
"🥕","🥕",
"🌽","🌽",
"🍰","🍰",
"🍩","🍩",
"🧁","🧁",
"☕","☕",
"🥛","🥛"
];

const game = document.getElementById("game");

let firstCard = null;
let secondCard = null;
let lockBoard = false;
let moves = 0;
let matches = 0;
let timer = 0;
let interval;

function shuffle(array){
for(let i=array.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[array[i],array[j]]=[array[j],array[i]];
}
return array;
}

function createBoard(){

game.innerHTML="";

shuffle([...emojis]).forEach(emoji=>{

const card=document.createElement("div");
card.className="card flip";

card.dataset.emoji=emoji;

card.innerHTML=`
<div class="card-inner">
<div class="front">❓</div>
<div class="back">${emoji}</div>
</div>
`;

card.addEventListener("click",flipCard);

game.appendChild(card);

});

setTimeout(()=>{

document.querySelectorAll(".card").forEach(card=>{
card.classList.remove("flip");
});

document.getElementById("message").textContent=
"Encuentra todas las parejas";

startTimer();

},5000);

}

function flipCard(){

if(lockBoard) return;
if(this===firstCard) return;
if(this.classList.contains("matched")) return;
if(timer===0 && document.getElementById("message").textContent==="Memoriza las cartas...") return;

this.classList.add("flip");

if(!firstCard){
firstCard=this;
return;
}

secondCard=this;

moves++;
document.getElementById("moves").textContent=moves;

checkMatch();
}

function checkMatch(){

if(firstCard.dataset.emoji===secondCard.dataset.emoji){

firstCard.classList.add("matched");
secondCard.classList.add("matched");

matches++;

resetCards();

if(matches===10){

clearInterval(interval);

document.getElementById("win").innerHTML=
"🎉 ¡FELICIDADES! COMPLETASTE EL MEMORAMA 🎉";

}

}else{

lockBoard=true;

setTimeout(()=>{

firstCard.classList.remove("flip");
secondCard.classList.remove("flip");

resetCards();

},800);

}

}

function resetCards(){
[firstCard,secondCard,lockBoard]=[null,null,false];
}

function startTimer(){

clearInterval(interval);

interval=setInterval(()=>{

timer++;
document.getElementById("timer").textContent=timer;

},1000);

}

function restartGame(){

moves=0;
matches=0;
timer=0;

document.getElementById("moves").textContent="0";
document.getElementById("timer").textContent="0";
document.getElementById("win").innerHTML="";
document.getElementById("message").textContent="Memoriza las cartas...";

clearInterval(interval);

firstCard=null;
secondCard=null;
lockBoard=false;

createBoard();

}

createBoard();

</script>

</body>
</html>
